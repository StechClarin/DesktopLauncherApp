<div class="flex h-screen w-screen bg-[#020617] text-slate-200 overflow-hidden font-sans selection:bg-blue-500/30">

    <!-- 1. DYNAMIC SIDEBAR -->
    <app-hub-sidebar 
        [isSidebarOpen]="isSidebarOpen()" 
        [activeTab]="hubService.activeTab()"
        (tabChange)="hubService.setActiveTab($event)">
    </app-hub-sidebar>

    <!-- 2. MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        
        <!-- 1. PERSISTENT HEADER / TOPBAR (Always Visible) -->
        <app-hub-header 
            [isSidebarOpen]="isSidebarOpen()"
            [user]="user()"
            [tenantName]="hubService.tenantName()"
            (toggleSidebar)="toggleSidebar()"
            (logout)="logOut()">
        </app-hub-header>

        <!-- 2. CONTENT AREA (Switchable) -->
        <div class="flex-1 relative overflow-hidden bg-black/20">
            
            <!-- HUB CONTENT (Home, Library, Store, etc.) -->
            <div class="absolute inset-0 overflow-y-auto custom-scrollbar" 
                 [class.hidden]="!hubService.isHubActive()">
                
                <!-- BACKGROUND ELEMENTS (Immersive) -->
                <div class="absolute inset-0 pointer-events-none">
                    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/10 blur-[120px] rounded-full"></div>
                    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600/10 blur-[120px] rounded-full"></div>
                </div>

                <!-- VIEW ROUTING -->
                <div class="relative z-10 min-h-full">
                    @if (hubService.selectedApp()) {
                        <app-app-detail-view></app-app-detail-view>
                    } @else {
                        @switch (hubService.activeTab()) {
                            @case ('home') { <app-home-view></app-home-view> }
                            @case ('library') { <app-library-view></app-library-view> }
                            @case ('store') { <app-store-view></app-store-view> }
                            @case ('downloads') { <app-downloads-view></app-downloads-view> }
                            @case ('settings') { <app-settings-view></app-settings-view> }
                        }
                    }
                </div>
            </div>

            <!-- APP IFRAMES -->
            @for (tab of hubService.activeTabs(); track tab.id) {
                <div class="absolute inset-0 z-10 bg-black animate-in fade-in duration-500"
                     [class.hidden]="!tab.isActive">
                    <iframe [src]="getSafeUrl(tab.url)" class="w-full h-full border-none"></iframe>
                </div>
            }
        </div>
    </main>

    <!-- 3. IMMERSIVE APP DETAIL OVERLAY -->
    <!-- Removed App Detail View from here and moved it to inside main content container -->

</div>
