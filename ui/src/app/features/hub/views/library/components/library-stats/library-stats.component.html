<div class="grid grid-cols-2 lg:grid-cols-4 gap-6">
    @for (stat of hubService.libraryStats(); track stat.label) {
    <div class="group p-6 rounded-[32px] bg-slate-900/40 border border-white/5 backdrop-blur-xl hover:border-white/10 transition-all duration-500 hover:-translate-y-2 relative overflow-hidden">
        <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
            <span class="material-symbols-outlined text-6xl">{{ stat.icon }}</span>
        </div>
        <p class="text-slate-500 font-bold text-xs uppercase tracking-widest mb-1">{{ stat.label }}</p>
        <h3 class="text-4xl font-black text-white group-hover:text-blue-400 transition-colors">{{ stat.value }}</h3>
        <div class="mt-4 flex items-center gap-2">
             <span class="w-1.5 h-1.5 rounded-full" [style.background-color]="stat.color"></span>
             <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Performance Optimale</span>
        </div>
    </div>
    }
</div>
