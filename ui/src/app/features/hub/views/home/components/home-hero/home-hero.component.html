<section class="mb-12 relative group select-none">
    <!-- Glow effect behind -->
    <div class="absolute -inset-1.5 bg-gradient-to-r from-blue-600/30 to-purple-600/30 rounded-3xl blur-md opacity-40 group-hover:opacity-75 transition duration-1000"></div>
    
    <div class="relative h-[380px] rounded-2xl bg-slate-950 overflow-hidden border border-white/5 shadow-2xl">
        <!-- Slides Wrapper -->
        @for (slide of slides(); track slide.title; let idx = $index) {
            <div class="absolute inset-0 transition-opacity duration-1000 ease-in-out"
                [class.opacity-100]="activeSlideIndex === idx"
                [class.opacity-0]="activeSlideIndex !== idx"
                [class.pointer-events-none]="activeSlideIndex !== idx">
                
                <!-- Background Image with overlay -->
                <div class="absolute inset-0 bg-cover bg-center transition-transform duration-1000"
                    [class.scale-105]="activeSlideIndex === idx"
                    [style.backgroundImage]="'url(' + slide.image + ')'">
                    <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/80 to-transparent"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-90"></div>
                </div>

                <!-- Slide Content -->
                <div class="absolute inset-0 p-8 md:p-12 flex flex-col justify-center max-w-2xl z-10 animate-in fade-in slide-in-from-left-4 duration-500">
                    <div class="flex items-center gap-3 mb-4">
                        <span [ngClass]="slide.tagClass" class="px-3 py-1 rounded-full text-[9px] font-extrabold uppercase tracking-widest">
                            {{ slide.tag }}
                        </span>
                    </div>

                    <h1 class="text-4xl md:text-5xl font-black text-white mb-4 leading-tight tracking-tight uppercase">
                        {{ slide.title }}
                    </h1>

                    <p class="text-sm md:text-base text-slate-300 mb-8 leading-relaxed max-w-xl font-light">
                        {{ slide.description }}
                    </p>

                    <div class="flex items-center gap-4">
                        <button (click)="onActionClick(slide)"
                            class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white text-xs font-black rounded-xl shadow-lg shadow-blue-600/30 hover:shadow-blue-500/40 transition-all hover:-translate-y-0.5 active:translate-y-0 flex items-center gap-2 group/btn">
                            <span>{{ slide.actionText }}</span>
                            <span class="material-symbols-outlined text-[16px] group-hover/btn:translate-x-1 transition-transform">arrow_forward</span>
                        </button>
                    </div>
                </div>
            </div>
        }

        <!-- Left/Right Arrows -->
        <button (click)="prevSlide()"
            class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-xl bg-slate-950/60 border border-white/5 text-slate-400 hover:text-white hover:bg-slate-900/80 transition-all flex items-center justify-center z-20 backdrop-blur opacity-0 group-hover:opacity-100">
            <span class="material-symbols-outlined text-[20px]">chevron_left</span>
        </button>
        <button (click)="nextSlide()"
            class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-xl bg-slate-950/60 border border-white/5 text-slate-400 hover:text-white hover:bg-slate-900/80 transition-all flex items-center justify-center z-20 backdrop-blur opacity-0 group-hover:opacity-100">
            <span class="material-symbols-outlined text-[20px]">chevron_right</span>
        </button>

        <!-- Dots Pagination -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-2.5 z-20">
            @for (slide of slides(); track slide.title; let idx = $index) {
                <button (click)="goToSlide(idx)"
                    [ngClass]="activeSlideIndex === idx ? 'bg-blue-500 w-8 h-1.5' : 'bg-white/20 h-1.5 w-1.5'"
                    class="rounded-full transition-all duration-300 hover:bg-white/50"
                    [attr.title]="'Slide ' + (idx + 1)">
                </button>
            }
        </div>
    </div>
</section>
