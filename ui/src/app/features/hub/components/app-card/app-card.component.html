@if (mode() === 'grid') {
    <div (click)="hubService.selectedApp.set(app())"
        class="group relative bg-[#0f172a] hover:bg-[#1e293b] border border-white/5 hover:border-blue-500/30 rounded-2xl overflow-hidden transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl cursor-pointer flex flex-col">

        <!-- Top: Image Area -->
        <div class="h-32 w-full relative overflow-hidden bg-slate-800">
            <div class="absolute inset-0 bg-cover bg-center transition-transform duration-500 group-hover:scale-110"
                [style.backgroundImage]="'url(' + (app().banner || 'https://via.placeholder.com/400x200') + ')'">
            </div>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent opacity-80">
            </div>
            <div
                class="absolute top-2 right-2 px-2 py-0.5 rounded bg-black/60 backdrop-blur text-[10px] font-mono text-white border border-white/10">
                v{{ app().version }}
            </div>
            
            <!-- Play Button Overlay -->
            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <div (click)="launchApp($event, app())" 
                     class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-xl scale-75 group-hover:scale-100 transition-transform duration-300">
                    <span class="material-symbols-outlined text-2xl font-black">play_arrow</span>
                </div>
            </div>
        </div>

        <!-- Bottom: Footer Info -->
        <div class="p-4 flex items-center gap-4 bg-[#0f172a] group-hover:bg-[#162032] transition-colors flex-1">
            <div class="w-10 h-10 rounded-lg bg-slate-800 border border-white/5 flex items-center justify-center text-cyan-400 shrink-0"
                [innerHTML]="getSafeSvg(app().icon)">
            </div>
            <div class="flex-1 min-w-0">
                <h3 class="font-bold text-white text-sm truncate group-hover:text-blue-400 transition-colors">
                    {{ app().name }}</h3>
                <div class="flex items-center gap-2 mt-0.5">
                    @if (app().status === 'installed' || hubService.isAppLicensed(app())) {
                        <div class="w-1.5 h-1.5 rounded-full bg-green-500"></div>
                        <span class="text-[10px] text-slate-500 uppercase font-bold tracking-wide">Installé</span>
                    } @else {
                        <div class="w-1.5 h-1.5 rounded-full bg-blue-500"></div>
                        <span class="text-[10px] text-slate-500 uppercase font-bold tracking-wide">Disponible</span>
                    }
                </div>
            </div>
        </div>
    </div>
} @else {
    <!-- Original List Style -->
    <div (click)="hubService.selectedApp.set(app())"
        class="group flex items-center gap-6 p-4 rounded-2xl bg-[#0f172a] hover:bg-[#162032] border border-white/5 hover:border-orange-500/30 transition-all cursor-pointer">
        
        <div class="relative w-16 h-16 rounded-xl overflow-hidden shrink-0">
            <div class="absolute inset-0 bg-cover bg-center"
                [style.backgroundImage]="'url(' + (app().banner || '') + ')'"></div>
            <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center text-orange-400 text-2xl"
                [innerHTML]="getSafeSvg(app().icon)"></div>
        </div>

        <div class="flex-1 min-w-0">
            <h3 class="font-bold text-white group-hover:text-orange-400 transition-colors">
                {{ app().name }}</h3>
            <div class="flex items-center gap-2 mt-1">
                <span class="text-[10px] text-slate-500 bg-white/5 px-1.5 py-0.5 rounded">v{{ app().version }}</span>
                <span class="text-[10px] text-orange-400/80 font-mono">12h</span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button (click)="launchApp($event, app())"
                class="p-2 rounded-lg bg-white/5 hover:bg-blue-600 text-slate-400 hover:text-white transition-all active:scale-95 group/play shadow-lg hover:shadow-blue-600/20">
                <span class="material-symbols-outlined text-xl">play_arrow</span>
            </button>
            <button (click)="$event.stopPropagation()" class="p-2 rounded-lg text-slate-500 hover:bg-white/10 hover:text-white transition-colors">
                <span class="material-symbols-outlined text-xl">more_vert</span>
            </button>
        </div>
    </div>
}
