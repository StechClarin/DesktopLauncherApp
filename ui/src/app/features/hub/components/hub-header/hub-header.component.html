<header
    data-tauri-drag-region
    class="h-12 bg-slate-900/80 backdrop-blur-md border-b border-white/5 flex items-center px-4 justify-between z-50 select-none drag-region">

    <!-- Left: Menu Trigger & Logo -->
    <div class="flex items-center gap-4 no-drag">
        <button (click)="onToggleSidebar()"
            class="p-2 rounded-lg hover:bg-white/10 transition-colors text-slate-300 hover:text-white active:scale-95 group">
            <svg xmlns="http://www.w3.org/2000/svg" 
                class="h-6 w-6 transition-transform duration-500" 
                [class.rotate-180]="!isSidebarOpen()"
                fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
            </svg>
        </button>
    </div>

    <!-- Center: Navigation (Optional) / System Info -->
    <div class="flex items-center gap-6 no-drag">
        <!-- Hub Update Notification -->
        @if (hubService.hasUpdate()) {
            <button class="flex items-center gap-2 px-3 py-1.5 bg-blue-600/20 border border-blue-500/30 rounded-full hover:bg-blue-600/30 transition-all group no-drag animate-pulse"
                title="Une mise à jour du Hub est disponible !">
                <span class="material-symbols-outlined text-[16px] text-blue-400 group-hover:text-blue-300">system_update</span>
                <span class="text-[10px] font-black text-blue-400 group-hover:text-blue-300 uppercase tracking-widest hidden md:block">Mise à jour disponible</span>
                <div class="w-1.5 h-1.5 rounded-full bg-blue-400 shadow-[0_0_8px_#60a5fa] ml-1"></div>
            </button>
        }
    </div>

    <!-- Right: System Controls -->
    <div class="flex items-center gap-3 no-drag">
        <!-- User Profile -->
        <div class="flex items-center gap-2 px-2 py-1 hover:bg-white/5 rounded-md cursor-pointer transition-colors group relative">
            <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-purple-500 to-cyan-500 flex items-center justify-center text-[10px] font-bold text-white shadow-lg shadow-blue-500/20">
                SC
            </div>
            <span class="text-xs text-slate-400 group-hover:text-slate-200 transition-colors">StechClarin</span>
            
            <!-- Context Menu (Simplified Logout) -->
            <div class="absolute right-0 top-full mt-1 w-48 bg-slate-900 border border-white/10 rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-[100] p-1">
                <button (click)="logOut()" class="w-full flex items-center gap-3 px-3 py-2 text-xs text-red-400 hover:bg-red-500/10 rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Déconnexion
                </button>
            </div>
        </div>

        <!-- Window Controls -->
        <div class="flex items-center gap-1 pl-4 border-l border-white/5">
            <button (click)="minimizeWindow()"
                class="p-2 hover:bg-white/10 rounded-md text-slate-400 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
                </svg>
            </button>
            <button (click)="maximizeWindow()"
                class="p-2 hover:bg-white/10 rounded-md text-slate-400 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
            </button>
            <button (click)="closeWindow()"
                class="p-2 hover:bg-red-500 hover:text-white rounded-md text-slate-400 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>
</header>
