<header
    data-tauri-drag-region
    class="h-12 bg-slate-900/80 backdrop-blur-md border-b border-white/5 flex items-center px-4 justify-between z-50 select-none">

    <!-- Left: Menu Trigger & Logo -->
    <div class="flex items-center gap-4 no-drag">
        <button (click)="onToggleSidebar()"
            class="p-2 rounded-lg hover:bg-white/10 transition-colors text-slate-300 hover:text-white active:scale-95 group">
            <svg xmlns="http://www.w3.org/2000/svg" 
                class="h-6 w-6 transition-transform duration-500" 
                [class.rotate-180]="!isSidebarOpen()"
                fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
            </svg>
        </button>
    </div>

    <!-- Center: Browser-Style Tabs -->
    <div class="flex-1 flex items-center h-full px-2 gap-1 overflow-hidden no-drag">
        
        <!-- FIXED HUB TAB -->
        <div (click)="hubService.selectTab('hub')"
            class="h-9 px-4 flex items-center gap-2 rounded-t-lg cursor-pointer transition-all duration-300 group relative shrink-0"
            [class.bg-white/10]="hubService.isHubActive()"
            [class.text-white]="hubService.isHubActive()"
            [class.text-slate-500]="!hubService.isHubActive()"
            [class.hover:bg-white/5]="!hubService.isHubActive()">
            <span class="material-symbols-outlined text-[18px]">grid_view</span>
            <span class="text-[11px] font-bold uppercase tracking-wider hidden lg:block">Hub</span>
            
            <!-- Active Indicator Line -->
            @if (hubService.isHubActive()) {
                <div class="absolute bottom-0 left-2 right-2 h-0.5 bg-blue-500 rounded-full shadow-[0_0_8px_#3b82f6]"></div>
            }
        </div>

        <!-- DIVIDER -->
        <div class="w-px h-4 bg-white/10 mx-1 shrink-0"></div>

        <!-- DYNAMIC APP TABS -->
        <div class="flex-1 flex items-center gap-1 overflow-x-auto no-scrollbar mask-fade-right">
            @for (tab of hubService.activeTabs(); track tab.id) {
                <div class="h-9 min-w-[120px] max-w-[200px] px-3 flex items-center justify-between gap-2 rounded-t-lg cursor-pointer transition-all duration-300 group relative shrink-0 border-x border-t border-transparent"
                    [class.bg-slate-800/80]="tab.isActive"
                    [class.border-white/10]="tab.isActive"
                    [class.text-white]="tab.isActive"
                    [class.text-slate-500]="!tab.isActive"
                    [class.hover:bg-white/5]="!tab.isActive"
                    (click)="hubService.selectTab(tab.id)">
                    
                    <div class="flex items-center gap-2 truncate">
                        <div class="w-5 h-5 rounded bg-blue-500/20 flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-[14px] text-blue-400">rocket_launch</span>
                        </div>
                        <span class="text-[11px] font-medium truncate uppercase tracking-tight">{{ tab.name }}</span>
                    </div>

                    <!-- Close Button -->
                    <button (click)="$event.stopPropagation(); hubService.closeTab(tab.id)"
                        class="p-1 rounded-md opacity-0 group-hover:opacity-100 hover:bg-white/10 text-slate-400 hover:text-red-400 transition-all shrink-0">
                        <span class="material-symbols-outlined text-[14px]">close</span>
                    </button>

                    <!-- Active Indicator Line -->
                    @if (tab.isActive) {
                        <div class="absolute bottom-0 left-1 right-1 h-0.5 bg-cyan-400 rounded-full shadow-[0_0_8px_#22d3ee]"></div>
                    }
                </div>
            }
        </div>
    </div>

    <!-- Right: System Controls -->
    <div class="flex items-center gap-3 no-drag">
        <!-- User Profile -->
        <div class="flex items-center gap-2 px-2 py-1 hover:bg-white/5 rounded-md cursor-pointer transition-colors group relative">
            <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-purple-500 to-cyan-500 flex items-center justify-center text-[10px] font-bold text-white shadow-lg shadow-blue-500/20 uppercase">
                {{ initials() }}
            </div>
            <span class="text-xs text-slate-400 group-hover:text-slate-200 transition-colors truncate max-w-[120px]">
                {{ tenantName() || user()?.email || 'Invité' }}
            </span>
            
            <!-- Context Menu (Simplified Logout) -->
            <div class="absolute right-0 top-full mt-1 w-48 bg-slate-900 border border-white/10 rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-[100] p-1">
                <button (click)="logOut()" class="w-full flex items-center gap-3 px-3 py-2 text-xs text-red-400 hover:bg-red-500/10 rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Déconnexion
                </button>
            </div>
        </div>

        <!-- Window Controls -->
        <div class="flex items-center gap-1 pl-4 border-l border-white/5 no-drag">
            <button (click)="minimizeWindow()"
                class="p-2 hover:bg-white/10 rounded-md text-slate-400 hover:text-white transition-colors" title="Réduire">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12h16" />
                </svg>
            </button>
            <button (click)="maximizeWindow()"
                class="p-2 hover:bg-white/10 rounded-md text-slate-400 hover:text-white transition-colors" [title]="isMaximized() ? 'Restaurer' : 'Agrandir'">
                @if (isMaximized()) {
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 4h10a2 2 0 012 2v10m-4 4H6a2 2 0 01-2-2V10a2 2 0 012-2h10a2 2 0 012 2v10a2 2 0 01-2 2z" />
                    </svg>
                } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <rect x="4" y="4" width="16" height="16" rx="2" stroke-width="2" />
                    </svg>
                }
            </button>
            <button (click)="closeWindow()"
                class="p-2 hover:bg-red-500 hover:text-white rounded-md text-slate-400 transition-colors" title="Fermer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>
</header>
