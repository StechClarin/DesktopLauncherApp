name: "publish"

on:
  push:
    branches:
      - etherna_prod
    tags:
      - 'v*'
  pull_request:
    branches:
      - etherna_prod
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm64 & x64
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04" # for Debian & AppImage
            args: ""
          - platform: "windows-latest" # for MSI & NSIS
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos-latest macos-n.0.0-latest
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install root dependencies
        run: npm install

      - name: install frontend dependencies
        run: cd ui && npm install

      - name: build frontend
        run: cd ui && npm run build
        env:
          # Example of passing secrets to the build
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # For public vars from .env, they should be added here too if not checked in
          VITE_HUB_VERSION: "1.0.0"
          VITE_PRODUCTION: "true"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'EtherNanos Hub v__VERSION__' || '' }}
          releaseBody: "Automated release from GitHub Actions"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: generate metadata snippet
        shell: bash
        run: |
          mkdir -p bin/artifacts
          # Map matrix platform to friendly OS name
          PLATFORM="${{ matrix.platform }}"
          OS_NAME="unknown"
          if [[ "$PLATFORM" == *"windows"* ]]; then OS_NAME="win";
          elif [[ "$PLATFORM" == *"macos"* ]]; then OS_NAME="mac";
          elif [[ "$PLATFORM" == *"ubuntu"* ]]; then OS_NAME="linux"; fi

          # Create a temporary json file for this platform's artifacts
          echo "{\"os\": \"$OS_NAME\", \"platform\": \"$PLATFORM\"}" > bin/artifacts/os_info.json

      - name: upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.platform }}
          path: bin/artifacts/os_info.json
          retention-days: 1

  sync-to-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push tag commit to etherna_prod
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:refs/heads/etherna_prod --force
